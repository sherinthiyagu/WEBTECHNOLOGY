<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Technology Assessment</title>

<link rel="stylesheet" href="quiz.css">
```

</head>

<body>

```
<div id="homePage" class="page">

    <div class="hero">

        <h1>WEB TECHNOLOGY ASSESSMENT</h1>

        <p class="tagline">
            <i>"Take the Quiz. Track Your Progress"</i>
        </p>

        <button id="startBtn">
            Begin Assessment
        </button>

    </div>

</div>


<div id="quizPage" class="page" style="display:none;">

    <div class="quiz-card">

        <div class="quiz-header">

            <h2>Web Technology Assessment</h2>

            <span id="questionCount"></span>

        </div>


        <div class="progress">

            <div id="progressBar"></div>

        </div>


        <h3 id="categoryName"></h3>

        <h2 id="questionText"></h2>

        <div id="optionsContainer"></div>


        <div class="navigation">

            <button id="previousBtn">Previous</button>

            <button id="nextBtn">Next</button>

        </div>

    </div>

</div>


<div id="resultPage" class="page" style="display:none;">

    <div class="result-card">

        <h1>Assessment Report</h1>


        <div class="score-box">

            <h2 id="finalScore"></h2>

            <h3 id="percentage"></h3>

            <h2 id="grade"></h2>

        </div>


        <div class="chart-section">

            <h2>Performance Analysis</h2>

            <canvas id="pieChart"></canvas>

        </div>


        <div class="analysis">

            <h2>Category Analysis</h2>

            <div id="analysisContent"></div>

        </div>


        <div class="review">

            <h2>Answer Review</h2>

            <div id="reviewContainer"></div>

        </div>


        <div class="result-buttons">

            <button id="retryBtn">Retake Quiz</button>

            <button onclick="window.print()">Print Report</button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="questions.js"></script>
<script src="quiz.js"></script>
```

</body>
</html>
