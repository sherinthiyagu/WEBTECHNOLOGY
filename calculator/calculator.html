<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body>

    <div class="calculator">

        <h1>Calculator</h1>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="function" onclick="calculate('percent')">%</button>
            <button class="function" onclick="clearEntry()">CE</button>
            <button class="function" onclick="clearAll()">C</button>
            <button class="function" onclick="backspace()">⌫</button>

            <button class="scientific" onclick="calculate('sin')">sin</button>
            <button class="scientific" onclick="calculate('cos')">cos</button>
            <button class="scientific" onclick="calculate('tan')">tan</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button class="scientific" onclick="calculate('sqrt')">√x</button>
            <button class="scientific" onclick="calculate('square')">x²</button>
            <button class="scientific" onclick="calculate('log')">log</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button class="scientific" onclick="calculate('ln')">ln</button>
            <button class="scientific" onclick="calculate('reciprocal')">1/x</button>
            <button class="number" onclick="addNumber('7')">7</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button class="number" onclick="addNumber('4')">4</button>
            <button class="number" onclick="addNumber('5')">5</button>
            <button class="number" onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="number" onclick="addNumber('1')">1</button>
            <button class="number" onclick="addNumber('2')">2</button>
            <button class="number" onclick="addNumber('3')">3</button>
            <button class="equal" onclick="calculateResult()">=</button>

            <button class="function" onclick="changeSign()">±</button>
            <button class="number" onclick="addNumber('0')">0</button>
            <button class="number" onclick="addNumber('.')">.</button>

        </div>

    </div>

    <script src="calculator.js"></script>

</body>
</html>
